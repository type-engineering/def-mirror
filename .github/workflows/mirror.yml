# Täglicher Spiegellauf: Quelle ernten → signieren → prüfen → committen.
#
# Fail-closed an jeder Stelle. Der gefährlichste Fehler dieses Feeds ist nicht
# der Abbruch, sondern der leere Datensatz: "keine Meldungen" liest sich wie
# "alles in Ordnung". Deshalb bricht jeder Schritt lieber ab und lässt den
# letzten guten Stand im Repo stehen, als etwas Halbes zu veröffentlichen.

name: mirror

on:
  # GitHub garantiert für `schedule` weder Zeitpunkt noch Ausführung, volle
  # Stunden sind am stärksten verspätet. Deshalb mehrere Termine abseits von
  # :00 — der erste erfolgreiche Lauf des Tages zählt, die übrigen enden an der
  # Tagessperre. Der pünktliche Hauptauslöser ist extern: cron-job.org, 05:07
  # UTC, POST /repos/type-engineering/def-mirror/actions/workflows/mirror.yml/
  # dispatches mit {"ref":"main"} und einem fine-grained PAT (nur dieses Repo,
  # Actions: read/write). Läuft der PAT ab, fällt nur dieser Auslöser weg —
  # die Termine hier sind das Netz darunter.
  schedule:
    - cron: "23 5 * * *"
    - cron: "53 6 * * *"
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Auch laufen, wenn heute schon ein Stand ausgeliefert wurde"
        type: boolean
        default: false

# Zwei gleichzeitige Läufe würden sich beim Push gegenseitig überschreiben.
# Ein wartender Lauf checkt erst beim Start aus und sieht dann den Stand seines
# Vorgängers — die Tagessperre greift also auch bei gleichzeitigen Auslösern.
concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Jeder Lauf erzeugt ein neues generatedAt und damit einen Commit. Ohne
  # Sperre gäbe es pro Auslöser einen "Stand"-Commit am selben Tag.
  tagessperre:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      erledigt: ${{ steps.pruefen.outputs.erledigt }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: defects.json
          sparse-checkout-cone-mode: false

      - name: Heute schon ausgeliefert?
        id: pruefen
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          heute = datetime.now(timezone.utc).date()
          try:
              stand = datetime.fromisoformat(
                  json.load(open("defects.json", encoding="utf-8"))["generatedAt"]
              ).astimezone(timezone.utc).date()
          except (OSError, ValueError, KeyError) as e:
              print(f"::warning::Veröffentlichter Stand nicht lesbar ({e}) — Lauf wird durchgeführt.")
              stand = None
          erledigt = stand == heute and os.environ["FORCE"] != "true"
          print(f"Veröffentlichter Stand: {stand}, heute: {heute}, erledigt: {erledigt}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"erledigt={'true' if erledigt else 'false'}\n")
          PY

  mirror:
    needs: tagessperre
    if: needs.tagessperre.outputs.erledigt != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Abhängigkeiten
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      # Ohne Schlüssel wird nicht veröffentlicht. Diese Prüfung steht vor dem
      # Abruf, damit der Lauf nicht erst die Quelle belastet und dann scheitert.
      - name: Schlüssel vorhanden?
        env:
          SIGNING_KEY_PEM: ${{ secrets.SIGNING_KEY_PEM }}
        run: |
          if [ -z "${SIGNING_KEY_PEM}" ]; then
            echo "::error::Secret SIGNING_KEY_PEM fehlt — unsigniert wird nicht ausgeliefert."
            exit 1
          fi
          if ! grep -vE '^[[:space:]]*#' KEYS | grep -q '[^[:space:]]'; then
            echo "::error::KEYS enthält keinen öffentlichen Schlüssel — ohne Vertrauensanker ist die Auslieferung wertlos."
            exit 1
          fi

      # Gate vor dem Netz: ein beschädigter Parser soll gar nicht erst die
      # Gelegenheit bekommen, den veröffentlichten Stand zu überschreiben —
      # besonders im Fall, in dem er still 0 statt der echten Einträge liefert.
      # Läuft gegen eine erfundene Fixture, nicht gegen einen Abzug der Quelle.
      - name: Regressionstest
        run: python tools/test_harvest.py

      - name: Ernten
        run: python tools/harvest.py --out defects.json --source-out defects-source.txt

      # Der leere Stand ist der Fehler, gegen den dieser Feed gebaut ist.
      - name: Nicht leer?
        run: |
          python - <<'PY'
          import json, sys
          feed = json.load(open("defects.json", encoding="utf-8"))
          anzahl = sum(len(feed.get(k, [])) for k in ("defects", "notices", "closures"))
          if anzahl == 0:
              print("::error::Der Lauf ergab null Einträge. Das sieht aus wie "
                    "'alles in Ordnung' und ist fast immer ein Parser- oder "
                    "Abruffehler. Der letzte gute Stand bleibt stehen.")
              sys.exit(1)
          print(f"{anzahl} Einträge geerntet.")
          PY

      - name: Signieren
        env:
          SIGNING_KEY_PEM: ${{ secrets.SIGNING_KEY_PEM }}
        run: |
          python tools/sign.py --payload defects.json --out defects.signed.json \
                               --key-id k1 --key-env SIGNING_KEY_PEM

      # Derselbe Lauf, den jeder Außenstehende machen kann. Er prüft, was die
      # Pipeline eben erzeugt hat, gegen die öffentlichen Schlüssel: Byte-
      # Gleichheit, Schema, Herkunft und Deckung. Scheitert er, ist der Stand
      # fehlerhaft und wird nicht committet.
      - name: Selbst prüfen
        run: |
          python tools/verify.py --envelope defects.signed.json --keys KEYS \
                                 --expect-json defects.json --source defects-source.txt

      - name: Committen, falls verändert
        run: |
          # Erst überhaupt vorhanden? Ein Lauf, der nichts geschrieben hat,
          # darf nicht als Erfolg enden.
          for f in defects.json defects.signed.json defects-source.txt; do
            if [ ! -s "$f" ]; then
              echo "::error::$f fehlt oder ist leer — es wurde nichts ausgeliefert."
              exit 1
            fi
          done
          # Vergleich gegen HEAD über den Index: `git diff` allein sieht
          # unverfolgte Dateien nicht und meldet für sie stets "unverändert".
          git add -- defects.json defects.signed.json defects-source.txt
          if git diff --cached --quiet -- defects.json defects.signed.json defects-source.txt; then
            echo "Unverändert — kein Commit."
            exit 0
          fi
          git config user.name  "mirror"
          git config user.email "type.engineering@posteo.de"
          git commit -m "Stand $(date -u +%Y-%m-%d)"
          git push

  # Totmannschalter: healthchecks.io erwartet täglich ein "ok". Bleibt es aus —
  # weil kein Auslöser gegriffen hat oder der Lauf gescheitert ist —, alarmiert
  # der Dienst von außen. Ein Lauf, der gar nicht startet, kann sich selbst
  # nicht melden; genau dafür ist die Überwachung außerhalb von GitHub.
  melden:
    needs: [tagessperre, mirror]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Healthcheck
        env:
          PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
          SPERRE: ${{ needs.tagessperre.result }}
          ERLEDIGT: ${{ needs.tagessperre.outputs.erledigt }}
          MIRROR: ${{ needs.mirror.result }}
        run: |
          if [ -z "${PING_URL}" ]; then
            echo "::warning::Secret HEALTHCHECK_PING_URL fehlt — ein ausbleibender Tagesstand fiele niemandem auf."
            exit 0
          fi
          # "ok" heißt: der heutige Stand liegt vor — frisch erzeugt oder schon
          # von einem früheren Lauf. Alles andere meldet /fail.
          if [ "$SPERRE" = success ] && { [ "$MIRROR" = success ] || { [ "$MIRROR" = skipped ] && [ "$ERLEDIGT" = true ]; }; }; then
            ziel="$PING_URL"; meldung=ok
          else
            ziel="$PING_URL/fail"; meldung=fail
          fi
          echo "tagessperre=$SPERRE mirror=$MIRROR → $meldung"
          # Ein gescheiterter Ping lässt den Stand unberührt; healthchecks.io
          # alarmiert dann ohnehin, weil das "ok" ausbleibt.
          curl -fsS -m 10 --retry 5 -o /dev/null "$ziel" \
            || echo "::warning::healthchecks.io nicht erreichbar."
